name: crypto-intelligence-terminal

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    environment:
      DATABASE_URL: postgresql://terminal:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/terminal
      AI_ANALYST_ENABLED: ${AI_ANALYST_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health?ready=1').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    mem_limit: 400m
    cpus: 0.5
    logging: *logging

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgresql://terminal:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/terminal
      WORKER_PORT: 3001
      HEARTBEAT_INTERVAL_MS: 5000
      MARKET_INGESTION_ENABLED: ${MARKET_INGESTION_ENABLED:-true}
      MARKET_SYMBOLS: ${MARKET_SYMBOLS:-}
      TOKEN_INGESTION_ENABLED: ${TOKEN_INGESTION_ENABLED:-}
      TOKEN_UNIVERSE: ${TOKEN_UNIVERSE:-}
      GOPLUS_ENABLED: ${GOPLUS_ENABLED:-}
      GOPLUS_API_KEY: ${GOPLUS_API_KEY:-}
      HELIUS_API_KEY: ${HELIUS_API_KEY:-}
      TRACKED_WALLETS: ${TRACKED_WALLETS:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-}
      BINANCE_FUTURES_BASE_URL: ${BINANCE_FUTURES_BASE_URL:-}
      BINANCE_WS_BASE_URL: ${BINANCE_WS_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    stop_grace_period: 10s
    init: true
    restart: unless-stopped
    mem_limit: 300m
    cpus: 0.5
    logging: *logging

  caddy:
    image: caddy:2-alpine
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/health?ready=1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    mem_limit: 100m
    cpus: 0.25
    logging: *logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: terminal
      POSTGRES_USER: terminal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U terminal -d terminal']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 500m
    cpus: 0.75
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=30]
    logging: *logging

volumes:
  postgres-data:
